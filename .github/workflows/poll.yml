name: Surveillance de la boîte mail

# Toutes les 5 minutes (au mieux : GitHub peut retarder l'exécution),
# et lancement manuel possible depuis l'onglet Actions.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Jamais deux passages en même temps (sinon l'état pourrait être écrasé).
concurrency:
  group: mailalerte-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 22 : firebase-admin 14 l'exige (Node 20 est en fin de vie).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Dépendances (firebase-admin) : node_modules est mis en cache d'après package-lock.json ;
      # l'installation n'a lieu qu'en cas de changement. Aucun secret n'est présent à ce stade.
      - name: Restaurer les dépendances
        id: deps
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Installer les dépendances
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      # État = empreintes des mails déjà vus (aucun texte de mail).
      # Clé unique par exécution ; on restaure le plus récent via le préfixe.
      - name: Restaurer l'état
        uses: actions/cache/restore@v6
        with:
          path: .cache/state.json
          key: mailalerte-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mailalerte-state-

      - name: Lire le flux et notifier
        id: poll
        env:
          UNIV_USER: ${{ secrets.UNIV_USER }}
          UNIV_PASSWORD: ${{ secrets.UNIV_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Firebase (facultatif : sans ces deux secrets, seul ntfy fonctionne).
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_UID: ${{ secrets.FIREBASE_UID }}
          # Variable (Settings > Secrets and variables > Actions > Variables) : « false » coupe ntfy.
          NTFY_ENABLED: ${{ vars.NTFY_ENABLED }}
        run: |
          echo "::add-mask::$UNIV_USER"
          echo "::add-mask::$UNIV_PASSWORD"
          echo "::add-mask::$NTFY_TOPIC"
          if [ -n "$FIREBASE_UID" ]; then echo "::add-mask::$FIREBASE_UID"; fi
          # Le JSON du compte de service (plusieurs lignes) n'est PAS passé à echo : une commande
          # add-mask ne masque qu'une ligne. Le programme masque lui-même chacun de ses champs
          # sensibles, avant tout autre affichage (src/mask.js).
          node src/main.js

      # Sauvegardé même si l'étape précédente échoue (marqueur « connexion refusée »),
      # mais seulement si l'état a changé, pour ne pas multiplier les caches.
      - name: Sauvegarder l'état
        if: always() && steps.poll.outputs.state_changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/state.json
          key: mailalerte-state-${{ github.run_id }}-${{ github.run_attempt }}
